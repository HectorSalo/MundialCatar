plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.skysam.hchirinos.mundial2026'
    compileSdk 36

    defaultConfig {
        applicationId "com.skysam.hchirinos.mundial2026"
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Torneo real (producción / release)
        buildConfigField "String", "TOURNAMENT_ID", '"world_cup_2026"'
        buildConfigField "String", "REAL_TOURNAMENT_ID", '"world_cup_2026"'
        buildConfigField "String", "DEMO_TOURNAMENT_ID", '"world_cup_2026_demo"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".demo"
            // Torneo demo en debug / QA
            buildConfigField "String", "TOURNAMENT_ID", '"world_cup_2026_demo"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {

    //Librerias externas
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.github.bumptech.glide:glide:5.0.5'

    //Firebase
    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.firebaseui:firebase-ui-auth:9.1.1'

    // Hilt (núcleo)
    implementation "com.google.dagger:hilt-android:2.57.2"
    kapt "com.google.dagger:hilt-android-compiler:2.57.2"
    implementation "androidx.hilt:hilt-navigation-fragment:1.3.0"
    kapt "androidx.hilt:hilt-compiler:1.3.0"

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.datastore:datastore-preferences:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}